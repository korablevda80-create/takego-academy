<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Take&Go — нет связи</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    min-height: 100vh; background: #17111f; color: #F2EDE2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    position: relative; overflow: hidden;
  }
  .glow { position: fixed; inset: 0; pointer-events: none; }
  .glow i { position: absolute; border-radius: 50%; display: block; }
  .g1 { top: -16%; right: -10%; width: 520px; height: 520px; filter: blur(120px);
        background: radial-gradient(circle, rgba(165,90,214,0.32), transparent 70%); }
  .g2 { bottom: -18%; left: -8%; width: 560px; height: 560px; filter: blur(130px);
        background: radial-gradient(circle, rgba(224,57,159,0.22), transparent 70%); }
  .card {
    position: relative; z-index: 1; width: 100%; max-width: 360px; text-align: center;
    background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.13);
    border-radius: 20px; padding: 36px 28px;
    backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 14px 32px -14px rgba(0,0,0,0.5);
  }
  .icon { width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 20px; display: block; }
  h1 { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
  p { font-size: 13.5px; line-height: 1.55; color: rgba(242,237,226,0.5); margin-bottom: 22px; }
  button {
    width: 100%; padding: 12px; border: none; border-radius: 12px; cursor: pointer;
    font-size: 14px; font-weight: 700; color: #fff; font-family: inherit;
    background: linear-gradient(135deg, #C6168D, #e0399f);
  }
</style>
</head>
<body>
  <div class="glow"><i class="g1"></i><i class="g2"></i></div>
  <div class="card">
    <img src="/icon-192.png" alt="Take&Go" class="icon" />
    <h1>Нет связи</h1>
    <p>Проверь интернет — в подсобке и на складе сигнал часто пропадает. Пройденные уроки сохранены, ничего не потеряется.</p>
    <button onclick="location.reload()">Попробовать снова</button>
  </div>
</body>
</html>
